<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineFind | Search movies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="site-nav">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="brand">CineFind</a>
      <div class="nav-links">
        <a href="index.html" class="active">Search</a>
        <a href="favourites.html">My favourites <span id="fav-count" class="count-pill">0</span></a>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="container">
      <h1>Find any movie.</h1>
      <p>Results update as you type.</p>
      <input id="search-input" type="search" class="form-control search-box"
             placeholder="Try &quot;Inception&quot; or &quot;Batman&quot;" autocomplete="off" autofocus>
    </div>
  </header>

  <main class="container pb-5">
    <p id="status" class="status" role="status"></p>
    <div id="results" class="row g-4"></div>
    <div class="text-center mt-4">
      <button id="load-more" class="btn btn-ink d-none">Load more</button>
    </div>
  </main>

  <!-- Script order matters: each file uses the ones above it -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
